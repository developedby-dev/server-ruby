# 출시 — 공개 거울 developedby-dev/server-ruby (ADR-0050). 원천은 모노레포 sdks/ruby/.github/workflows/release.yml — 거울에서 고치지 않는다.
# 판 태그(v1.0.0)를 밀면 시험하고 지은 젬을, 환경 release에서 대표가 승인한 뒤 RubyGems 신뢰 게시(OIDC)로 올린다. 올린 젬에는 GitHub 증명을 남긴다.
# 새 젬은 RubyGems 계정의 「대기 신뢰 게시자」로 첫 판부터 올린다(등록 뒤 12시간 안 — 게시 당일 등록, ADR-0050 6절). 손으로 돌리면(workflow_dispatch) 시험 · 짓기만 한다
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - run: ruby -w -Ilib -Itest test/test_server.rb
      - run: gem build bydev-server.gemspec
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: "*.gem"
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
      - name: 태그와 젬 판이 같은지
        env:
          TAG: ${{ github.ref_name }}
        run: test -f "bydev-server-${TAG#v}.gem"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.gem"
      # 신뢰 게시 키 — 새 젬의 첫 게시는 소유할 RubyGems 계정을 밝혀야 한다(`owner`, 2026-11 rubygems.org — 계정 developedby-dev의 고정 ID).
      # rubygems/configure-rubygems-credentials v2.1.0 · release-gem v1.4.2에는 그 입력이 없어 교환을 직접 한다(2026-11-21 첫 게시가 403으로 거절됨).
      # 키는 15분짜리 push_rubygem 전용이고 출력 · 로그에 남기지 않는다
      - name: 신뢰 게시 키 받기
        env:
          RUBYGEMS_OWNER: "256018"
        run: |
          set -euo pipefail
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          echo "::add-mask::$jwt"
          key=$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}' \
            | curl -sSf -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token -H "Content-Type: application/json" --data-binary @- \
            | jq -r .rubygems_api_key)
          echo "::add-mask::$key"
          test -n "$key" && test "$key" != null
          mkdir -p ~/.gem
          printf -- '---\n:rubygems_api_key: %s\n' "$key" > ~/.gem/credentials
          chmod 600 ~/.gem/credentials
      - name: 게시 (신뢰 게시)
        env:
          TAG: ${{ github.ref_name }}
        run: gem push "bydev-server-${TAG#v}.gem"
